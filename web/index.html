<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹사이트 품질점검 대시보드</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header><div><p class="eyebrow">NIHHS 운영 품질관리</p><h1>웹사이트 품질점검 대시보드</h1></div><div class="header-meta"><span id="connection" class="badge">연결 확인 중</span><span id="runState">대기</span><button id="aiOpen" class="secondary">AI 점검 도우미</button><button id="refresh" class="secondary">새로고침</button></div></header>
<main><section class="panel controls"><h2>수동 점검</h2><div class="control-grid"><label>대상 사이트<select id="target"><option value="all">전체 사이트</option><option value="nihhs">국립원예특작과학원 대표 홈페이지</option><option value="fruit">과수생육·품종정보 홈페이지</option></select></label><label>최대 페이지<input id="max" type="number" min="1" max="10" value="10"></label><label class="check"><input id="forceResource" type="checkbox"> 자원 강제점검 <span title="서버 요청과 실행시간이 증가합니다">ⓘ</span></label><label class="check"><input id="forceAccess" type="checkbox"> 접근성 강제점검 <span title="서버 요청과 실행시간이 증가합니다">ⓘ</span></label><label class="check"><input id="forceScreenshot" type="checkbox"> 스크린샷 강제생성 <span title="실행시간이 증가합니다">ⓘ</span></label></div><div class="actions"><button id="run">점검 시작</button><button id="stop" class="secondary">중지 요청</button><span id="message" role="status"></span></div></section>
<section class="panel progress"><div class="section-title"><h2>실행 진행</h2><span id="lastRun">마지막 점검: -</span></div><div class="progress-track"><div id="progressBar"></div></div><div class="progress-grid"><b>현재 단계<em id="stage">-</em></b><b>진행률<em id="progress">0%</em></b><b>처리 페이지<em id="processed">0</em></b><b>오류<em id="failures">0</em></b><b>점검 불가<em id="unavailable">0</em></b><b>경과시간<em id="elapsed">-</em></b></div></section>
<section class="cards"><div class="section-title"><h2>종합현황</h2><span>카드를 누르면 결과가 필터링됩니다</span></div><div id="summaryCards" class="card-grid"></div><div id="lifecycleCards" class="card-grid lifecycle"></div></section>
<section class="panel results"><div class="section-title"><h2>결과 목록</h2><span id="resultCount"></span></div><div class="filters"><input id="search" placeholder="URL·제목 검색"><select id="verdict"><option value="">종합판정 전체</option><option>정상</option><option>검토 필요</option><option>오류</option><option>점검 불가</option><option>제외</option></select><select id="issueType"><option value="">오류 유형 전체</option></select><select id="lifecycle"><option value="">생명주기 전체</option><option>신규</option><option>지속</option><option>변경</option><option>해결</option><option>재발</option></select></div><div class="table-wrap"><table><thead><tr><th>사이트</th><th>메뉴 경로</th><th>페이지 제목</th><th>URL</th><th>종합판정</th><th>오류 유형</th><th>생명주기</th><th>HTTP</th><th>응답시간</th><th>점검일시</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty">결과가 없습니다.</div><div class="pager"><button id="prev" class="secondary">이전</button><span id="pageInfo"></span><button id="next" class="secondary">다음</button></div></section>
<section class="panel history"><div class="section-title"><h2>실행 이력</h2><span>최근 50건</span></div><div id="historyRows"></div><h2>보고서</h2><div id="reports"></div></section></main><dialog id="detail"><button id="closeDetail" class="close">닫기</button><article id="detailBody"></article></dialog><dialog id="aiPanel"><button id="aiClose" class="close">닫기</button><h2>AI 점검 도우미</h2><p id="aiStatus" class="muted">연결 상태 확인 중</p><div id="chatLog" class="chat-log"></div><div class="ai-suggestions"><button data-q="오늘 오류를 요약해줘" class="secondary">오늘 오류 요약</button><button data-q="신규·재발 문제만 알려줘" class="secondary">신규·재발</button><button data-q="조치 우선순위를 정리해줘" class="secondary">조치 우선순위</button></div><label>질문<textarea id="aiQuestion" maxlength="2000" rows="3" placeholder="점검결과에 대해 질문하세요"></textarea></label><button id="aiSend">전송</button></dialog><script src="/assets/app.js"></script></body></html>
